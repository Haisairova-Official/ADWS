[package]
name = "adws-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
description = "ADWS native plugin process supervisor"

[[bin]]
name = "adws-plugin-runner"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
